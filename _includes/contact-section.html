<section id="contact" class="contact">

    <div><p class="eyebrow">LET’S CONNECT</p><h2>Have something in mind?</h2><p>{{ site.data.contact.message }}</p></div>
    <div class="contact-links">
      <a class="contact-email" href="mailto:{{ site.data.contact.email }}">{{ site.data.contact.email }} <span aria-hidden="true">↗</span></a>
      <a href="tel:{{ site.data.contact.phone }}">{{ site.data.contact.phone_display }}</a>
      <a href="https://linkedin.com/in/ali-aliyev-1b24a6381" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
    </div>
  </div>
</section>
